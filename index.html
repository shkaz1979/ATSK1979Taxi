<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBRAHIM TAXI</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>
<style>
:root{
  --bg:#F2F4F5; --card:#FFFFFF; --ink:#17212B; --muted:#5F6B76; --line:#DCE1E5;
  --amber:#E2A10C; --amber-ink:#1B1400; --meter:#141B21; --meter-ink:#F6B91A;
  --flag:#C2410C; --flag-bg:#FFF1E6; --ok:#2F7A4F; --danger:#B42318; --chip:#E9EDF0;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101519; --card:#1A2127; --ink:#E7ECEF; --muted:#97A3AD; --line:#2B343C;
  --amber:#F0B42A; --amber-ink:#1B1400; --meter:#0A0E11; --meter-ink:#F6B91A;
  --flag:#FB8B4E; --flag-bg:#3A2418; --ok:#5CC08A; --danger:#F97066; --chip:#232C33; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101519; --card:#1A2127; --ink:#E7ECEF; --muted:#97A3AD; --line:#2B343C;
  --amber:#F0B42A; --amber-ink:#1B1400; --meter:#0A0E11; --meter-ink:#F6B91A;
  --flag:#FB8B4E; --flag-bg:#3A2418; --ok:#5CC08A; --danger:#F97066; --chip:#232C33; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--meter)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--meter);color:#DDE3E8;margin:0 -14px;padding:12px 16px 14px}
.brand{font:700 22px var(--cond);color:var(--meter-ink);letter-spacing:.03em;margin:0 0 4px 4px}
.hrow{display:flex;align-items:center;gap:10px}
.month{display:flex;align-items:center;gap:4px}
.month button{background:transparent;border:0;color:#DDE3E8;width:36px;height:36px;border-radius:8px;font-size:20px}
.month button:hover{background:#ffffff14}
.month span{font:600 18px var(--cond);min-width:132px;text-align:center}
.meter{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto;text-align:right}
.meter b{display:block;font:700 24px/1 var(--cond);color:var(--meter-ink);letter-spacing:.02em}
.meter small{font-size:12px;color:#9AA6B0}

nav.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto}
nav.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs .n{display:inline-block;margin-left:6px;font-size:12px;background:var(--flag);color:#fff;border-radius:999px;padding:0 7px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.dayfilter{display:flex;gap:6px;flex:1 1 100%}
.dayfilter input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}
.dayfilter .btn{padding:8px 12px}
#v-trips .filters input{flex:1 1 100%}
.filters input,.filters select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}

.day{margin:18px 0 6px;display:flex;align-items:baseline;justify-content:space-between;color:var(--muted);font-weight:600;font-size:14px}
.day b{color:var(--ink);font:700 17px var(--cond)}
.trip{display:grid;grid-template-columns:62px minmax(0,1fr) max-content;gap:2px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.trip:hover{border-color:var(--muted)}
.trip.flag{border-left:4px solid var(--flag);background:linear-gradient(90deg,var(--flag-bg),var(--card) 40%)}
.trip .tm{font:600 15px var(--cond);color:var(--muted);padding-top:1px;grid-column:1;grid-row:1/3;white-space:nowrap}
.trip .who{font-weight:700}
.trip .route{color:var(--muted);font-size:14px;grid-column:2;grid-row:2;min-width:0;overflow-wrap:anywhere}
.trip .who{grid-column:2;grid-row:1;min-width:0;overflow-wrap:anywhere}
.trip .amt{font:700 18px var(--cond);text-align:right;grid-column:3;grid-row:1}
.trip .drv{grid-column:3;grid-row:2;font-size:14px;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap;padding-left:8px}
.trip .rem{grid-column:2/4;font-size:13px;color:var(--flag)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:13px;color:var(--muted);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--chip)}
.tbl tfoot td{font-weight:700;background:var(--chip)}
h2{font:700 20px var(--cond);margin:22px 0 8px}
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.panel p{margin:0 0 10px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%}
.mini{border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px}
.mini:hover{background:var(--chip);color:var(--danger)}

.scrim{position:fixed;inset:0;background:#0007;z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;background:var(--card);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}

.fgroup{margin-bottom:14px}
.fgroup label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fgroup input,.fgroup select,.fgroup textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.fgroup textarea{resize:vertical;height:60px}
.fgroup .check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.fgroup .check input{width:20px;height:20px;margin:0}

.summary-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.scard val{display:block;font:700 24px var(--cond);margin-top:2px}
.scard.ok val{color:var(--ok)}
.scard.muted val{color:var(--muted)}
.scard.danger val{color:var(--danger)}

.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--amber);color:var(--amber-ink);border:0;border-radius:999px;padding:14px 22px;font:700 18px var(--cond);box-shadow:0 6px 18px #0003}
.fab[hidden]{display:none}
</style>
</head>
<body>

<script>
(function() {
    var p = prompt("Enter Password to access IBRAHIM TAXI:");
    if (p !== "12345") {
        alert("Incorrect password!");
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:100px;font-family:sans-serif;'>Access Denied.</h1>";
        window.stop();
    }
})();
</script>

    <div class="brand">🚖 IBRAHIM TAXI</div>

      <div class="month">

        <span id="monthLbl"></span>
        <button id="next">▶</button>

      <div class="meter">
        <b id="tot-received">0 KD</b>
        <small>Total Received</small>
      </div>

  <nav class="tabs">

    <button id="t-payments">Payments</button>
    <button id="t-tocheck">To check <span class="n" id="n-tocheck" hidden>0</span></button>
    <button id="t-fixed">Fixed rides</button>
    <button id="t-customers">Customers</button>
    <button id="t-drivers">Drivers</button>
